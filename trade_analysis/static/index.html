<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tradeAnalysis</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>tradeAnalysis</h1>
        <p>实盘交易复盘，不构成投资建议。</p>
      </div>
      <div class="status-pill" id="status-pill">待分析</div>
    </header>

    <main class="workspace">
      <section class="control-dock" aria-label="导入与分析工具">
        <details class="tool-panel" id="analysis-tools">
          <summary>
            <span class="summary-title">数据源与分析参数</span>
            <span class="summary-meta" id="source-summary">样例数据</span>
          </summary>
          <form id="source-form" class="source-grid">
            <label>
              <span>成交数据</span>
              <input id="input-source" name="input" autocomplete="off">
            </label>
            <label>
              <span>策略信号</span>
              <input id="strategy-source" name="strategy" autocomplete="off">
            </label>
            <label>
              <span>标的画像</span>
              <input id="stock-source" name="stock" autocomplete="off">
            </label>
            <label>
              <span>账户规模</span>
              <input id="account-size" name="account_size" type="number" min="0" step="1000">
            </label>
            <label>
              <span>高频阈值</span>
              <input id="overtrade-count" name="overtrade_daily_count" type="number" min="1" step="1">
            </label>
            <button class="primary-action" type="submit" id="analyze-button">
              <span class="button-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 4-6"/></svg>
              </span>
              分析
            </button>
          </form>
        </details>

        <details class="tool-panel" id="image-tools">
          <summary>
            <span class="summary-title">图片识别导入</span>
            <span class="summary-meta" id="image-summary">上传或输入本地截图路径</span>
          </summary>
          <form id="image-form" class="image-grid">
            <label>
              <span>委托截图</span>
              <input id="image-file" name="image_file" type="file" accept="image/*">
            </label>
            <label>
              <span>图片路径</span>
              <input id="image-path" name="image_path" autocomplete="off">
            </label>
            <button class="secondary-action" type="submit" id="image-button">
              <span class="button-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
              </span>
              识别导入
            </button>
          </form>
          <div class="import-result" id="import-result"></div>
        </details>
      </section>

      <section class="metrics-band" aria-label="总览指标" id="metrics-band"></section>

      <section class="content-grid">
        <section class="data-pane" aria-label="实际交易数据">
          <div class="pane-head">
            <div>
              <h2>实际交易数据</h2>
              <span id="trade-count">0 笔</span>
            </div>
            <div class="segmented" role="tablist" aria-label="数据视图">
              <button type="button" class="segment active" data-view="trades">交易</button>
              <button type="button" class="segment" data-view="matched">配对</button>
              <button type="button" class="segment" data-view="open">持仓</button>
            </div>
          </div>
          <div class="table-wrap">
            <table id="data-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <aside class="analysis-pane" aria-label="分析结果">
          <div class="pane-head">
            <div>
              <h2>分析结果</h2>
              <span id="finding-count">0 项</span>
            </div>
            <div class="risk-meter" id="risk-meter" aria-label="风险等级"></div>
          </div>

          <div class="selected-trade" id="selected-trade">
            <div class="empty-state">选择一笔交易查看对应问题和建议</div>
          </div>

          <div class="section-block">
            <h3>主要问题</h3>
            <div class="finding-list" id="finding-list"></div>
          </div>

          <div class="section-block">
            <h3>操作建议</h3>
            <div class="recommendation-list" id="recommendation-list"></div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
