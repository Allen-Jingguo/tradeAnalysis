<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tradeAnalysis</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="page-header">
    <div class="brand">
      <div class="logo">↗</div>
      <div class="brand-line">
        <h1>tradeAnalysis</h1>
        <p>实盘交易复盘 · 不构成投资建议</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-danger" type="button" id="clear-button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-9 4l1 10h8l1-10"/></svg>
        清除历史数据
      </button>
      <button class="btn btn-import" type="button" id="image-button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
        确认导入
      </button>
      <div class="status-pill" id="status-pill">待分析</div>
    </div>
  </header>

  <main class="container">
    <!-- Hero + Utility row -->
    <section class="top-grid">
      <div class="card hero-card" id="hero-card">
        <div class="hero-icon-wrap">
          <div class="hero-shield" id="hero-shield">!</div>
        </div>
        <div class="hero-main">
          <h2 id="hero-title">待分析</h2>
          <p id="hero-sub">上传截图或选择数据源后点击分析</p>
        </div>
        <div class="hero-divider"></div>
        <div class="hero-advice" id="hero-advice">
          <div class="advice-label">◎ 复盘建议</div>
          <strong id="hero-advice-text">—</strong>
        </div>
      </div>

      <div class="card utility-card" id="data-source-card">
        <div class="utility-head">
          <div class="utility-title"><span class="icon-box icon-blue">▣</span>数据源</div>
          <button class="utility-toggle" type="button" id="toggle-source">⌄</button>
        </div>
        <div class="utility-main" id="source-main">—</div>
        <div class="utility-status" id="source-status"></div>
      </div>

      <div class="card utility-card" id="image-card">
        <div class="utility-head">
          <div class="utility-title"><span class="icon-box icon-purple">▧</span>图片识别导入</div>
          <label class="btn-upload" for="image-file">上传图片</label>
          <input id="image-file" type="file" accept="image/*" multiple style="display:none">
        </div>
        <div class="utility-main" id="image-main">未选择</div>
        <div class="utility-status" id="image-status">
          <span class="utility-sub" id="image-summary">上传或输入本地截图路径</span>
        </div>
        <div class="import-result" id="import-result"></div>
      </div>
    </section>

    <!-- Collapsed source form (hidden by default) -->
    <div class="source-drawer" id="source-drawer" hidden>
      <form id="source-form" class="source-grid">
        <label><span>成交数据</span><input id="input-source" name="input" autocomplete="off"></label>
        <label><span>策略信号</span><input id="strategy-source" name="strategy" autocomplete="off"></label>
        <label><span>标的画像</span><input id="stock-source" name="stock" autocomplete="off"></label>
        <label><span>账户规模</span><input id="account-size" name="account_size" type="number" min="0" step="1000"></label>
        <label><span>高频阈值</span><input id="overtrade-count" name="overtrade_daily_count" type="number" min="1" step="1"></label>
        <label><span>图片路径</span><textarea id="image-path" name="image_path" rows="2" autocomplete="off"></textarea></label>
        <label><span>识别模式</span>
          <select id="image-agent" name="image_agent">
            <option value="local">本地 OCR</option>
            <option value="deepseek-v4-pro">DeepSeek V4 Pro Agent</option>
          </select>
        </label>
        <button class="btn btn-primary" type="submit" id="analyze-button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 4-6"/></svg>
          分析
        </button>
      </form>
    </div>

    <!-- KPI row -->
    <section class="metric-grid" id="metrics-band"></section>

    <!-- Workspace -->
    <section class="workspace-grid">
      <!-- Left: trade table -->
      <div class="card">
        <div class="panel-header">
          <div>
            <div class="panel-title-row">
              <span class="icon-box icon-blue">☷</span>
              <h2 class="panel-title">实际交易数据</h2>
              <span class="panel-subtitle" id="trade-count">0 笔</span>
            </div>
          </div>
          <div class="toolbar">
            <div class="segmented" role="tablist" aria-label="数据视图">
              <button type="button" class="segment active" data-view="trades">交易</button>
              <button type="button" class="segment" data-view="matched">配对</button>
              <button type="button" class="segment" data-view="open">持仓</button>
            </div>
          </div>
        </div>
        <div class="table-scroll">
          <table id="data-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- Right: analysis panel -->
      <aside class="card analysis-card">
        <div class="analysis-top">
          <div class="panel-title-row">
            <span class="icon-box bg-red-icon">▧</span>
            <h2 class="panel-title">分析结果</h2>
            <span class="panel-subtitle" id="finding-count">0 项发现</span>
          </div>
          <div class="risk-badge" id="risk-meter"></div>
        </div>

        <div class="analysis-tabs">
          <div class="segmented" role="tablist" aria-label="分析结果视图">
            <button type="button" class="analysis-segment active" data-analysis-view="trade">当前交易</button>
            <button type="button" class="analysis-segment" data-analysis-view="findings">问题</button>
            <button type="button" class="analysis-segment" data-analysis-view="recommendations">建议</button>
            <button type="button" class="analysis-segment" data-analysis-view="live">实盘分析</button>
          </div>
        </div>

        <div class="analysis-body">
          <div class="analysis-panel active" data-analysis-panel="trade">
            <div class="selected-trade" id="selected-trade">
              <div class="empty-state">选择一笔交易查看对应问题和建议</div>
            </div>
          </div>

          <div class="analysis-panel" data-analysis-panel="findings">
            <div class="finding-summary" id="finding-summary"></div>
            <div class="finding-list" id="finding-list"></div>
          </div>

          <div class="analysis-panel" data-analysis-panel="recommendations">
            <div class="recommendation-list" id="recommendation-list"></div>
          </div>

          <div class="analysis-panel" data-analysis-panel="live">
            <div class="live-analysis" id="live-analysis">
              <div class="empty-state">上传截图后自动生成实盘分析</div>
            </div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <!-- Clear confirm modal -->
  <div class="modal-backdrop" id="clear-confirm" hidden>
    <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="clear-title">
      <h2 id="clear-title">确认清除历史数据？</h2>
      <p>这会清空当前界面展示的数据和分析结果，并删除自动生成的图片导入 CSV。不会删除你的原始截图、样例数据或手工 CSV。</p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" type="button" id="cancel-clear">取消</button>
        <button class="btn btn-danger-solid" type="button" id="confirm-clear">确认清除</button>
      </div>
    </div>
  </div>

  <!-- Image import confirm modal -->
  <div class="modal-backdrop" id="image-confirm" hidden>
    <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="image-confirm-title">
      <h2 id="image-confirm-title">确认上传并识别图片？</h2>
      <p id="image-confirm-message">将上传并识别已选择的图片。</p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" type="button" id="cancel-image-import">取消</button>
        <button class="btn btn-primary" type="button" id="confirm-image-import">确认导入</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
